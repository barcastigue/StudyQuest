spring.application.name=studyquest

#Setup JDBC connection (start MySQL in XAMPP first)
spring.datasource.url=jdbc:mysql://localhost:3306/studyquest_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
#Setup db login credentials (XAMPP default: root, no password)
spring.datasource.username=root
spring.datasource.password=
#Auto create tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#for stack trace error not to appear
server.error.include-stacktrace=never
server.port=8080